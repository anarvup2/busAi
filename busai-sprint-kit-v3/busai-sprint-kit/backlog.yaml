        - "Audio frames never cross the socket (tested)"
        - "Calling any non-allow-listed SDK or MQTT method raises and is logged without arguments"
        - "8 h soak with 6 simulated cameras: stable memory, no leaked sessions"
        - "Grep test: bridge logs and metrics never contain passwords, deviceSecret, tokens or frame bytes"
        - "Live 10 min sub stream from one pilot camera reaches the recorder (needs H-02)"
      out_of_scope: ["Decoding or rendering video", "Live view in the Katch app (it already embeds the vendor player)", "Applying camera settings at runtime"]

