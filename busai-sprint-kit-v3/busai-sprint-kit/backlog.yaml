  - id: S4-09
    sprint: S4
    owner: claude_code
    status: todo
    depends_on: [S3-06, S2-06]
    needs_input: [H-18, H-11]
    title: "Tender-grade accuracy report (VDV 457-style protocol) and tender compliance pack"
    done_when: "Publishable report regenerates from the harness"
    brief:
      context: "No vendor has published an independent accuracy figure for buses in India; the only peer-reviewed field study measured 53–83% (Pronello & Garzón Ruiz 2023). The first published Indian report sets the benchmark tenders copy (Part B), and it is what Phase 3 needs for CESL PM-eBus Sewa (two stereo counters per bus at >= 95%) and BMTC-type trials."
      deliver:
        - "ml/harness/tender_report.py: VDV 457-style method (whole-trip total error <= 2–5%, stop-level faults counted), splits by source (counter, AI, edge), view, crowding, day/night; sample sizes and confidence intervals"
        - "docs/reports/accuracy-report.md generated: method, protocol agreed in H-18, results, limits; no operator names, conductor IDs, images or route identifiers"
        - "docs/reports/tender-compliance.md generated: devices by origin_country and certification_ref (BIS CRS / ER-01 status from H-11), data residency statement, retention and access controls"
      acceptance:
        - "Same inputs → byte-identical report"
        - "Report refuses to state a figure for any split under 20 stops"
        - "Automated check finds no personal or operator-identifying data in the published files"
      out_of_scope: ["Publishing the report (people decide)", "ITxPT / AIS-153 integration (post-pilot backlog)"]
