# BusAI / VV-Co backlog — single source of truth for Claude Code and people.
# Four one-week sprints, one per phase, built by Claude Code in auto mode.
#
# tickets[].status: todo | in_progress | review | blocked | done | dropped
#   Claude Code sets in_progress, review (merged into sprint branch) and blocked.
#   People set done (after merging the sprint branch to main) and dropped.
# tickets[].depends_on: other tickets; satisfied when status is review or done.
# tickets[].needs_input: human inputs (H-xx). NOT a start blocker: build against sim/
#   and fixtures/; if an acceptance item can only pass with the input, mark the ticket
#   blocked and explain in BLOCKED.md.
# Briefs in tasks/ are generated: python tools/render_briefs.py

version: 3
plan_doc: "https://claude.ai/code/artifact/c6a73b2f-8fd0-4423-b280-ea61f11c69a1"
source_docs:         # VV-Co working docs by Apurva Oza, Basecamp project "HBO + ABO + UV", Docs & Files
  part_b_key_aspects: "https://app.basecamp.com/4531610/buckets/49226321/documents/10399563327"
  phased_approach_review: "https://app.basecamp.com/4531610/buckets/49226321/documents/10399537046"
  part_a_technical_architecture: "https://app.basecamp.com/4531610/buckets/49226321/documents/10399548939"
mode: auto           # Claude Code merges green tickets into sprint/<id>; people merge sprint/<id> to main on Friday

sprints:
  - {id: S1, phase: 1, name: "Phase 1 — clips and manual review", start: 2026-10-19, end: 2026-10-23, gate: G1, goal: "Pilot buses record a clip at every stop; a manager can review a trip against ticket ticks; G1 evidence pack ready Friday"}
  - {id: S2, phase: 2, name: "Phase 2 — nightly AI count",         start: 2026-10-26, end: 2026-10-30, goal: "Every pilot clip is counted overnight; managers see AI counts vs tickets with ranked flags"}
  - {id: S3, phase: 3, name: "Phase 3 — door counters",            start: 2026-11-02, end: 2026-11-06, goal: "FOORIR counts land in crossing_event and the same report; nightly retrain loop running"}
  - {id: S4, phase: 4, name: "Phase 4 — edge vision",              start: 2026-11-09, end: 2026-11-13, goal: "Same model and rule run on an RK3588 or Pi 5 + Hailo-8L box; only crossing events leave the bus"}

gates:
  - {id: G1, name: "Access",         date: 2026-10-23, estimate: false, pass: "Warner sub stream (streamid 0) measured at <=300 kbps with >=640x360 and >=5 fps; time to first frame <=3 s after pre-connect; vendor relay residency acceptable (H-14); Katch events within 30 s", on_fail: "Sprint 2 adds the on-bus clip gateway (LAN/ONVIF) for the affected fleet", evidence: S1-05, result: null}
  - {id: G2, name: "First operator", date: 2026-11-06, estimate: false, pass: "One operator reviews flagged trips weekly", on_fail: "Fix ranking before trusting AI flags", evidence: S1-11, result: null}
  - {id: G3, name: "Accuracy",       date: 2026-11-27, estimate: true,  pass: ">=85% per-stop boardings on top-down views; >=80% of flags confirmed", on_fail: "Add door cameras or move Phase 3 counters to the lead; hold Phase 4 fitting", evidence: S4-07, result: null}
  - {id: G4, name: "Pricing",        date: 2026-12-18, estimate: true,  pass: "Operator accepts >=Rs500/bus-month or success fee; recovered fares > 3x price", on_fail: "Reposition as tender-grade Phase 3 product", evidence: S4-07, result: null}

inputs:   # only people can supply these; Claude Code never marks them done
  - {id: H-01, needed_by: 2026-10-16, status: todo, title: "Order 2–4 FOORIR HX-CCD22 counters and 2 edge kits (Pi 5 + AI Kit or RK3588, 9–36 V DC-DC, enclosure); record FOORIR's quote, MOQ, lead time, warranty text and BIS R-number"}
  - {id: H-02, needed_by: 2026-10-19, status: todo, title: "Pilot access: Warner cloud account + device IDs and device passwords for the 6 cameras on 3 pilot buses; Katch sandbox/topic (Parth); all injected as env vars; Warner SDK zip in the private bucket"}
  - {id: H-03, needed_by: 2026-10-19, status: todo, title: "Cloud account in an Indian region with budget cap; staging-only deploy role; night GPU quota"}
  - {id: H-04, needed_by: 2026-10-19, status: todo, title: "One day of Katch events for 3 buses, exported by Parth"}
  - {id: H-05, needed_by: 2026-10-23, status: todo, title: "Pilot operator named (10 buses, routes, city); operator letter; DPDP processor agreement signed between VV-Co and the operator (signatory decided); notice stickers on 10 buses; operator announces the audit policy to conductors; sign the data-flow note"}
  - {id: H-06, needed_by: 2026-10-26, status: todo, title: "Two depot managers review flagged trips weekly"}
  - {id: H-07, needed_by: 2026-10-26, status: todo, title: "Ground truth: >=100 stops counted by people in the tool, each twice"}
  - {id: H-08, needed_by: 2026-10-28, status: todo, title: "Parth embeds the review WebView + SSO in the Katch Android app"}
  - {id: H-09, needed_by: 2026-10-28, status: todo, title: "Check ~10% of auto-labels (~400 frames)"}
  - {id: H-10, needed_by: 2026-11-04, status: todo, title: "Fit FOORIR units (door contact on DI); run the commissioning script"}
  - {id: H-11, needed_by: 2026-11-06, status: todo, title: "BIS CRS / ER-01 advice on the depth-only counter SKU"}
  - {id: H-12, needed_by: "after G3", status: todo, title: "Fit edge boxes on two pilot buses"}
  - {id: H-13, needed_by: "every Friday", status: todo, title: "Review and merge the sprint branch; G1–G4 calls and GPU choice from evidence packs"}
  - {id: H-14, needed_by: 2026-10-21, status: todo, title: "Warner answers: relay and cloud hosting location, settable sub-stream encoder, server-side SDK or RTSP, token rotation, LAN password derivation, limited-scope account (questions in docs/vendor/warner-h5sdk.md)"}
  - {id: H-15, needed_by: 2026-10-22, status: todo, title: "Run tools/commission_warner.py --apply on the 6 pilot cameras: set device passwords, alarm push off, on-camera boxes off, audio off, continuous sub-stream SD recording on"}
  - {id: H-16, needed_by: 2026-10-21, status: todo, title: "eSIM data plan per pilot bus today and the cost of ~16–20 GB/month if it is smaller (Parth); the biggest lever on cost per bus"}
  - {id: H-17, needed_by: 2026-10-21, status: todo, title: "Camera positions per bus type on the pilot fleet: does either camera see a door from above? A photo of each view and the door count per bus (Parth)"}
  - {id: H-18, needed_by: 2026-10-23, status: todo, title: "Pilot success metrics agreed with the pilot operator before deployment, as the charter requires: VDV 457-style per-stop protocol, 85 % / 95 % thresholds, KPI targets in docs/business-brief.md (KParth + Upsquare)"}
  - {id: H-19, needed_by: 2026-11-06, status: todo, title: "Pricing inputs for G4: Katch's current per-bus subscription to operators, and the pilot pricing hypothesis (per bus-month, share of recovered fares, or both)"}
  - {id: H-20, needed_by: 2026-10-26, status: todo, title: "Shareholders' agreement points that change the code: operator permission (in the processor agreement) to train models on its footage; VV-Co owns the IP created for it; licence terms for pre-existing Katch and Upsquare code"}
  - {id: H-21, needed_by: "after G1", status: todo, title: "Extend read-only pilot access from 3 to all 10 pilot buses and commission their cameras (H-15 steps); KPI: 10 buses live by week 12"}

tickets:

# ═════════════════════════ Sprint 1 — Phase 1: clips and manual review ═════════════════════════
  - id: S1-01
    sprint: S1
    owner: claude_code
    status: todo
    needs_input: [H-03]
    title: "Scaffold: Python 3.12 monorepo, docker-compose, CI, secret scanning, Terraform for staging in an Indian region"
    done_when: "make dev green; staging deploys"
    brief:
      context: "Nothing exists yet. Create the layout in CLAUDE.md so every later ticket has a home, plus a staging environment Claude Code can deploy to."
      deliver:
        - "Directory layout from CLAUDE.md; pyproject.toml (uv), ruff, mypy, pytest"
        - "infra/docker-compose.yml: postgres:16, minio, mosquitto, keycloak; healthchecks"
        - "Makefile: dev, test, lint, replay, deploy-staging"
        - "CI: lint, types, tests, gitleaks secret scan, tools/render_briefs.py --check"
        - "infra/terraform/staging: Indian region only (ap-south-1 or equivalent), budget alarm, object store with 30-day lifecycle, no prod resources"
        - "BLOCKED.md and DECISIONS.md at repo root with headings only"
        - "Node 20 + Playwright (headless Chromium) in the toolchain for the Warner bridge (S1-14)"
        - "vendor/ git-ignored; make vendor fetches the Warner SDK zip from the private bucket and checks vendor/warner_h5sdk.sha256"
      acceptance:
        - "make dev brings every service healthy on a clean machine"
        - "Secret scan fails CI when a file contains 'hf123456'"
        - "CI fails if any file under vendor/warner_h5sdk/ is committed"
        - "terraform plan for staging shows only the Indian region"
        - "make deploy-staging succeeds (needs H-03; otherwise blocked with plan output attached)"
      out_of_scope: ["Production environment", "Business logic"]

  - id: S1-02
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-01]
    title: "Schema v0: the 10 entities plus operator, audit_log and review_session; operator-scoped rows; event tables partitioned by day, idempotent natural keys"
    done_when: "Migrations apply up and down"
    brief:
      context: "docs/architecture-brief.md → Data model. crossing_event is shared by every phase. Each bus operator is a separate DPDP data fiduciary and VV-Co is its processor (docs/business-brief.md), so every row must be attributable to one operator from day one."
      deliver:
        - "db/migrations/ (Alembic): operator, vehicle, device, trip, stop_event, ticket_event, clip, crossing_event, stop_reconciliation, flag, ground_truth_count, audit_log, review_session"
        - "operator: id, name, katch_operator_id, processor_agreement_ref, training_permitted (bool, default false), audit_policy_announced_on, plan, trial_ends_on"
        - "operator_id on every operator-owned table (directly or through vehicle), indexed; Postgres row-level security policies keyed on a session operator_id"
        - "flag: est_leakage_inr, recovered_inr (entered by the operator), decided_at; decision is only ever set with a reviewer_id"
        - "review_session: reviewer_id, operator_id, trip_id, started_at, ended_at (feeds the review-effort KPI)"
        - "device: origin_country, certification_ref (BIS R-number or none) for tender compliance reports"
        - "Daily range partitions on ticket_event, crossing_event, stop_event + partition-maker job"
        - "Unique natural keys for idempotent ingest (ticket_id; device+ts+direction+track_id for crossings; clip_id+model_version for AI rows)"
        - "device.credentials_ref (text, vault path); no column holds a secret"
      acceptance:
        - "alembic upgrade head and downgrade base succeed in CI"
        - "crossing_event.source enum = ai_batch, counter, edge"
        - "Inserting the same ticket twice yields one row"
        - "With RLS on, a session for operator A reads zero rows of operator B (tested on every operator-owned table)"
        - "A flag decision without a reviewer_id is rejected by a constraint"
      out_of_scope: ["TimescaleDB", "Billing integration"]

  - id: S1-03
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-01]
    title: "Contracts as code: Katch events, CameraAdapter, counter contract, MQTT topic"
    done_when: "Every fixture validates"
    brief:
      context: "Turn the contracts in docs/architecture-brief.md into code every service imports."
      deliver:
        - "contracts/katch_events.py (Pydantic v2): ticket.issued, gps.position, trip.started, trip.ended; JSON Schema export"
        - "contracts/camera_adapter.py: abstract CameraAdapter shaped by the Warner SDK (docs/vendor/warner-h5sdk.md): preconnect(device), open_substream(device) -> FrameStream (no width/height/fps arguments; frames report actual width, height, codec, fps, timestamp), close(device), fetch_playback(device, start, end) -> FrameStream, get_time(device), capabilities(device), health(device), privacy_posture(device)"
        - "contracts/frames.py: Frame (kind I/P, codec H264/H265, width, height, fps, ts, Annex-B bytes) — no audio type exists in the contract"
        - "contracts/counter.py: FOORIR heartBeat and dataUpload models; normalised CounterEvent"
        - "contracts/mqtt.py: vvco/{vehicle}/{door}/crossing topic + payload"
        - "contracts/VERSION and CHANGELOG"
      acceptance:
        - "Every file under fixtures/katch and fixtures/foorir validates (skip cleanly if absent)"
        - "Katch ms and FOORIR µs timestamps both normalise to UTC"
      out_of_scope: ["Vendor-specific camera code"]

  - id: S1-04
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-03]
    needs_input: [H-04]
    title: "Simulators: Katch replayer, fake Warner camera serving frame dumps, FOORIR device with dropout and backfill"
    done_when: "A fixture day replays at 60x"
    brief:
      context: "Simulators let every service be built and tested without a bus. Until H-04 lands, generate a synthetic day clearly marked synthetic."
      deliver:
        - "sim/katch_replayer.py: replays fixtures/katch/<day> (or synthetic) to the webhook or topic at N x speed"
        - "sim/fake_camera.py: CameraAdapter serving fixture Annex-B frame dumps (from S1-13, or frames cut from MP4s), with injectable Warner error codes (-2, -11, -13, -20) and a configurable time-to-first-frame"
        - "sim/foorir_device.py: heartBeat per simulated minute, dataUpload per door-open period, dropout + backfill mode"
        - "make replay DAY=..."
      acceptance:
        - "A 16-hour day replays in under 20 minutes at 60x"
        - "Fake camera passes the CameraAdapter contract tests"
        - "Synthetic data is tagged synthetic in every record"
      out_of_scope: ["Video synthesis beyond looping fixture clips"]

  - id: S1-05
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-14]
    needs_input: [H-02, H-14, H-16, H-17]
    title: "G1 spike runners through the Warner bridge: sub-stream reality, time to first frame, relay path, SD playback, clock, posture, Katch latency"
    done_when: "G1 evidence pack on Friday"
    brief:
      context: "The Warner SDK cannot set sub-stream resolution or fps, so G1 now measures what the camera actually sends. G1 passes if the sub stream is <=300 kbps at >=640x360 and >=5 fps, the first frame arrives <=3 s after a pre-connected stream is opened, the relay location is acceptable (H-14), and Katch events arrive within 30 s. See docs/vendor/warner-h5sdk.md."
      deliver:
        - "tools/spikes/warner_probe.py (drives the bridge): per camera — connect by device ID, login, open sub stream (streamid 0) and main (1) for 10 min each; record actual width, height, codec, fps, kbps; time from connect, login and open to first I-frame; P2P direct vs relayed (TURN) and the relay host reached"
        - "SD playback probe: SreachRecord + StartPlayBack for a 30 min window; playback speed vs real time; one-search-per-device limit confirmed"
        - "getDeviceModal capability dump (keys only, no secrets): is any sub-stream encoder setting exposed?"
        - "tools/spikes/clock_drift.py: MQTT System.Time.TimeUtc vs frame timestamps vs Katch GPS vs server; 48 h unattended"
        - "Privacy posture snapshot per camera (properties listed in docs/vendor/warner-h5sdk.md)"
        - "tools/spikes/katch_latency.py: p50/p95 latency of ticket and GPS events; also checks per-ticket granularity (stop_id or lat/lon and a timestamp on every ticket) and records whether stop-level or only trip-level reconciliation is possible"
        - "docs/spikes/G1.md: evidence pack with pass/fail per condition, measured GB per bus-day for stop-window pulls against the eSIM plan (H-16), camera view per door (top-down or oblique, from H-17) with the expected accuracy band, the weighted rubric scores, and H-14 answers when they arrive"
      acceptance:
        - "Probes write metrics only: no frames, audio, credentials or User.List to disk or logs"
        - "Evidence pack generated from probe outputs by one command"
        - "Runs on all 6 pilot cameras (needs H-02; otherwise blocked with the fake-device report attached)"
        - "Relay residency row filled from H-14 (otherwise marked open)"
      out_of_scope: ["Making the G1 call (H-13)", "Changing any camera setting"]

  - id: S1-06
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-02, S1-03, S1-04]
    needs_input: [H-02]
    title: "Katch events adapter: webhook with signature check or topic consumer, idempotent upserts"
    done_when: "Replayed day, zero duplicates"
    brief:
      context: "Katch is the source of tickets, trips and GPS. Gate latency needs <=30 s end to end."
      deliver:
        - "services/ingest_katch/: webhook (HMAC verify, secret from env/vault) and optional topic consumer behind one handler"
        - "Upserts into trip and ticket_event; GPS to an internal stream for the gate; dead-letter table"
      acceptance:
        - "Replaying a day twice gives identical row counts"
        - "Bad signature → 401, nothing written"
        - "p95 ingest lag < 5 s at 60x replay"
        - "Connected to the Katch sandbox for a pilot bus (needs H-02)"
      out_of_scope: ["Production Katch feed"]

  - id: S1-07
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-06]
    title: "Stop-window gate: pre-connect on deceleration, window at speed 0 for > 5 s or POS events, 3 s padding, stop_event with dwell"
    done_when: ">=95% of Katch stops matched"
    brief:
      context: "Record only while doors are likely open (15–30% of the day). Warner P2P connect + login + open takes time, so the gate warns the bridge early."
      deliver:
        - "services/gate/: emits preconnect when speed falls below a configurable threshold (default 10 km/h); opens the window when speed_kmh == 0 for > 5 s or a ticket arrives while stationary; closes on movement; 3 s padding; emits release if the bus speeds up without stopping"
        - "stop_event rows (arrive, depart, dwell, lat, lon, nearest stop within a radius); record-window messages"
      acceptance:
        - "Unit tests: traffic light without tickets, stop with tickets, GPS gap, jitter near 0 km/h, slow crawl without a stop (preconnect then release)"
        - ">=95% of Katch-attributed stops in the replayed day matched"
        - "Preconnect leads window open by >= the time-to-first-frame measured in S1-05 (configurable; default 4 s)"
      out_of_scope: ["Door sensor input"]

  - id: S1-08
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-07, S1-04, S1-14]
    needs_input: [H-02, H-05, H-15]
    title: "Warner camera adapter over the bridge; clip recorder (remux, no decode) with 30-day lifecycle and overnight SD fill"
    done_when: "One clip per window on pilot buses"
    brief:
      context: "The clip store is what Phase 1 reviews and Phase 2 counts. ~0.6 GB per bus-day (S1-05 measures the real figure). Frames arrive from the Warner bridge as Annex-B H.264 or H.265; audio is already dropped there."
      deliver:
        - "services/camera_adapters/warner.py implementing CameraAdapter by talking to the bridge (S1-14) over its local socket; credentials from env/vault at call time"
        - "services/recorder/: keeps the last GOP per open stream so a clip starts on an I-frame inside the 3 s pre-roll; remuxes Annex-B to MP4 with FFmpeg -c copy; key {operator}/{vehicle}/{date}/{trip}/{stop_event}/{door}.mp4; clip rows with codec, width, height, fps"
        - "If codec is H.265, also writes a 360p H.264 review proxy (same lifecycle) for the Android WebView"
        - "Overnight job: SreachRecord + StartPlayBack via the bridge for windows with no clip, serialised per device"
      acceptance:
        - "Simulated day: exactly one clip per window per door camera, each starting on an I-frame"
        - "Killed worker leaves no orphan clip row"
        - "No clip contains an audio track (tested with ffprobe)"
        - "Pilot bus produces clips for a full duty day (needs H-02, H-05, H-15)"
      out_of_scope: ["Inference", "Face blur (open decision)", "Any camera setting change"]

  - id: S1-09
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-02]
    title: "API and auth: roles, signed clip URLs, audit row per clip view"
    done_when: "Every clip view audited (tested)"
    brief:
      context: "Clips are personal data under DPDP; every access is role-checked and logged. The operator is the data fiduciary, so a user only ever sees their own operator's data. Flags are evidence for a person to decide; nothing in the product penalises a conductor automatically."
      deliver:
        - "services/api/: FastAPI + OIDC (Keycloak in dev; Katch SSO adapter stub)"
        - "Roles: operator_admin, depot_manager, reviewer, annotator; conductor views for depot_manager and above"
        - "Every request sets the session operator_id from the token; all queries run under the S1-02 row-level security"
        - "GET /clips/{id}/url → signed URL <=5 min + audit_log row"
        - "Endpoints: trips by day, trip detail, flags, flag decision (confirm / dismiss with reviewer_id), recovered amount entry, ground-truth entry, review_session start/end"
      acceptance:
        - "Every issued clip URL writes exactly one audit row (tested)"
        - "Reviewer cannot read conductor rankings (tested)"
        - "A token for operator A gets 404 on any trip, clip or flag of operator B (tested)"
        - "No endpoint or job changes a flag to confirmed without a human reviewer_id (tested)"
        - "OpenAPI schema committed"
      out_of_scope: ["Katch SSO production wiring (H-08)"]

  - id: S1-10
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-09, S1-08]
    title: "Review screen as a WebView: stop timeline, ticket ticks, fast scrub, counted-boardings entry"
    done_when: "Playwright review passes at 360 px"
    brief:
      context: "Managers review on Android phones inside the Katch app (H-08). Scrub speed decides adoption, and review effort is a pilot KPI (<= 15 manager minutes per bus-week). Screen design from the Phased Approach Review: trip picker, player with timeline, stop card, trip summary."
      deliver:
        - "web/review/ (React + TS): trip picker (bus, date, trip, conductor, review-priority score); trip timeline with GPS stop markers, one tick per ticket, dwell; tap a stop to play its clip; 2x/4x playback"
        - "Stop card: dwell, tickets in the stop window, counted-boardings entry, auto-computed gap; trip summary: counted boardings vs tickets, gap in ₹, one-tap 'flag conductor' or 'clear'"
        - "Shortcuts: next stop, +1/-1 boardings, confirm; annotator mode for ground truth (boardings + alightings per door)"
        - "review_session start/end posted automatically while a trip is open"
        - "Embedding guide for Parth: docs/katch-webview.md"
      acceptance:
        - "Playwright at 360x740 completes a trip review on fixture data"
        - "A completed review writes one review_session with a plausible duration"
        - "H.265 clips play through their H.264 proxy; H.264 clips play directly"
        - "Clip URLs never stored in localStorage"
        - "Lighthouse accessibility >= 90"
      out_of_scope: ["AI counts (S2-09)"]

  - id: S1-11
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-07, S1-09]
    title: "Reconciliation v0: ticket-and-GPS trip ranking with a 1% control sample, ₹ leakage estimate, flag inbox, weekly one-page PDF"
    done_when: "Flags fill from the replayed day"
    brief:
      context: "Before AI, ticket and GPS data alone rank the trips worth watching, so a manager reviews 2–3% of trips, not all of them (Phased Approach Review, 'the sampling trick'). Phase 2 later feeds the same ranking with AI counts, so nothing here is thrown away. The pitch to operators is 'recover leaked fares', so every report leads with rupees."
      deliver:
        - "services/reconcile/: tickets vs counted boardings per stop → stop_reconciliation; trip-level mode for operators whose tickets lack stop or time granularity (per S1-05)"
        - "Ranking rules v0 in config: long dwell at a stop with zero tickets; revenue per km below the route's norm; a conductor whose tickets per stop sit below peers on the same route; conductor week-over-week drop"
        - "Random control sample of 1% of trips (seeded, reproducible), marked as control and never filtered by the rules"
        - "Leakage estimate in ₹: unticketed boardings × the median fare for that route and stop window; stored as flag.est_leakage_inr"
        - "flag rows + status workflow; weekly one-page PDF per operator led by estimated leakage and confirmed recoveries in ₹; G2 usage log (reviews per manager per week)"
      acceptance:
        - "Each rule unit-tested on a hand-built trip"
        - "On the replayed day the rules select <= 3% of trips, plus the 1% control"
        - "Control sample is identical for the same seed and independent of rule scores"
        - "Re-running a day is idempotent"
        - "PDF fits one A4 page and shows ₹ figures with their basis"
      out_of_scope: ["Learned thresholds", "Any automatic action against a conductor"]

  - id: S1-12
    sprint: S1
    owner: claude_code
    status: todo
    depends_on: [S1-08]
    title: "Retention and deletion jobs; observability with a no-clips-today alert"
    done_when: "Back-dated clips removed; alert fires"
    brief:
      context: "DPDP storage limitation, and silent camera failures are the main ops risk."
      deliver:
        - "Daily job reconciling clip rows vs object store; alert on any object > 30 days; delete-by-clip admin path with audit"
        - "Prometheus metrics per bus; Grafana dashboard JSON; alerts: active bus with zero clips by 12:00, ingest lag > 30 s"
        - "Warner metrics from the bridge: P2P error codes by type (-13 offline, -20 wrong password, -12 addressing), time to first frame, relayed vs direct share, SD card state"
        - "Daily Warner privacy-posture check (read-only MQTT gets): alert if alarm push, on-camera boxes or audio input are on, privacy mode is on, or continuous SD recording is off"
      acceptance:
