    brief:
      context: "Gates are human calls; Claude Code prepares the evidence. Pricing method from Part A, applied in order: cost floor, value ceiling, market anchors. Part B packaging: Phase 1 free for 60 days; Phase 2 ₹750 per bus-month list, ₹600 at >= 200 buses, ₹500 at >= 1,000, or 10–15% of verified recovered fares; Phases 3–4 hardware one-time plus ₹1,000–1,500 per bus-month. The 100-bus pilot runs at a loss by design."
      deliver:
        - "docs/gates/G3.md: harness report for the promoted model, flag confirm rate, sample sizes, caveats; G3 fail path (door cameras or Phase 3 counters as lead product)"
        - "docs/gates/G4.md: measured cost per bus-month (eSIM data, GPU, storage, core services, support, amortised engineering) at 100, 400 and 1,000 buses, all-in and variable"
        - "G4 pricing: cost floor = variable cost ÷ (1 − 0.65); value ceiling = 10–25% of recovered ₹ per bus-month and never above one recovered ₹25 fare a day (≈ ₹650); market anchors (AIS-140 device ≈ ₹250–400 a month over 3 years, PMPML AI kit ≈ ₹670, Katch's own subscription from H-19)"
        - "Sensitivity to the eSIM plan (H-16): cost with and without ~16 GB/month of existing headroom"
        - "Recovered ₹ from S3-09 vs price; the price x 3 test; recommended list price and success-fee option"
