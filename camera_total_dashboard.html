<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Counter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0b;
      --panel: #101012;
      --panel-soft: #151517;
      --panel-raised: #19191c;
      --ink: #f4f4f5;
      --muted: rgba(244, 244, 245, .42);
      --faint: rgba(244, 244, 245, .26);
      --line: rgba(255, 255, 255, .085);
      --line-strong: rgba(255, 255, 255, .14);
      --online: #82dba5;
      --delayed: #e6c36d;
      --offline: #e27d76;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    ::selection { background: rgba(244, 244, 245, .18); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .13);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes feedshift {
      to { background-position: 0 40px, 0 0, 0 0; }
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mono { font-family: "IBM Plex Mono", "Cascadia Mono", monospace; }
    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #09090a;
      z-index: 5;
    }
    .brand {
      width: 315px;
      flex: 0 0 315px;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      font: 600 11px "IBM Plex Mono", monospace;
    }
    .brand-copy { line-height: 1.15; }
    .brand-copy strong { display: block; font-size: 14px; font-weight: 600; }
    .brand-copy small { color: var(--muted); font-size: 11px; }

    .fleet-kpis {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    .top-kpi {
      min-width: 130px;
      padding: 0 23px;
      border-right: 1px solid var(--line);
    }
    .top-kpi:last-child { border-right: 0; }
    .top-kpi span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .top-kpi b {
      display: block;
      margin-top: 2px;
      font: 500 18px "IBM Plex Mono", monospace;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      min-width: 218px;
    }

    .button {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .button:hover { background: rgba(255, 255, 255, .06); }
    .button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }
    .button.danger {
      border-color: rgba(226, 125, 118, .38);
      color: var(--offline);
    }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .button svg, .icon-button svg { width: 14px; height: 14px; }
    .spinning svg { animation: spin .7s linear infinite; }

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .sidebar {
      flex: 0 0 350px;
      width: 350px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #09090a;
    }
    .sidebar-tools {
      flex: 0 0 auto;
      padding: 15px 12px 11px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .sidebar-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .sidebar-title strong { font-size: 12px; font-weight: 600; }
    .sidebar-title span { color: var(--muted); font: 11px "IBM Plex Mono", monospace; }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 10px;
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 33px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, .04);
      color: var(--ink);
      font-size: 12px;
    }
    .search:focus {
      border-color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .06);
    }
    .filters { display: flex; gap: 6px; }
    .filter {
      flex: 1;
      height: 29px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 7px;
      background: transparent;
      color: rgba(244, 244, 245, .6);
      font-size: 11px;
      font-weight: 500;
    }
    .filter.active {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--bg);
    }
    .bus-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 12px;
    }
    .bus-row {
      width: 100%;
      display: grid;
      grid-template-columns: 7px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      margin-bottom: 2px;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .bus-row:hover { background: rgba(255, 255, 255, .035); }
    .bus-row.selected {
      background: rgba(255, 255, 255, .06);
      box-shadow: inset 2px 0 var(--ink);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      display: inline-block;
      flex: none;
      border-radius: 50%;
      background: var(--offline);
    }
    .status-dot.online { background: var(--online); }
    .status-dot.delayed { background: var(--delayed); }
    .bus-copy { min-width: 0; }
    .bus-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .bus-line strong { font: 500 12.5px "IBM Plex Mono", monospace; }
    .bus-line span { color: var(--muted); font-size: 11px; }
    .bus-path {
      overflow: hidden;
      margin-top: 1px;
      color: rgba(244, 244, 245, .3);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bus-count { text-align: right; }
    .bus-count b { font: 500 14px "IBM Plex Mono", monospace; }
    .bus-count b small { color: var(--muted); font-size: 9px; font-weight: 400; }
    .bus-count span { display: block; color: var(--muted); font-size: 9px; }

    .detail {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 18px 22px 28px;
    }
    .detail-loading {
      display: grid;
      height: 100%;
      place-items: center;
      color: var(--muted);
    }
    .bus-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      min-height: 59px;
    }
    .bus-heading-line { display: flex; align-items: center; gap: 10px; }
    .bus-heading-line h1 {
      margin: 0;
      font: 600 27px "IBM Plex Mono", monospace;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 25px;
      padding: 0 9px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
    }
    .bus-subtitle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      color: var(--muted);
    }
    .separator { color: rgba(244, 244, 245, .18); }
    .bus-actions { display: flex; gap: 9px; }

    .occupancy-card {
      margin-top: 17px;
      padding: 17px 17px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }
    .occupancy-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .occupancy-value { font: 500 15px "IBM Plex Mono", monospace; white-space: nowrap; }
    .progress {
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }
    .progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--online);
      transition: width .25s ease;
    }
    .occupancy-stats {
      display: flex;
      gap: 42px;
      margin-top: 13px;
    }
    .occupancy-stats span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .55px;
    }
    .occupancy-stats b {
      display: block;
      margin-top: 2px;
      font: 500 17px "IBM Plex Mono", monospace;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .camera-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }
    .feed {
      position: relative;
      height: clamp(305px, 41vh, 475px);
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background-color: #0a0a0c;
      background-image:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, .022) 0 14px, transparent 14px 28px),
        radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .055), transparent 60%);
      animation: feedshift 7s linear infinite;
    }
    .feed-label {
      position: absolute;
      top: 10px;
      left: 12px;
      color: rgba(244, 244, 245, .42);
      font: 9.5px "IBM Plex Mono", monospace;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .live-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 6px;
      background: rgba(10, 10, 11, .55);
      color: var(--online);
      font: 9px "IBM Plex Mono", monospace;
      letter-spacing: .7px;
    }
    .live-badge.offline { color: var(--offline); }
    .live-badge.delayed { color: var(--delayed); }
    .live-badge .status-dot { width: 5px; height: 5px; animation: blink 1.6s ease-in-out infinite; }
    .crossing-line {
      position: absolute;
      top: 54%;
      right: 0;
      left: 0;
      border-top: 1px dashed rgba(244, 244, 245, .36);
    }
    .crossing-line span {
      position: absolute;
      top: -15px;
      color: rgba(244, 244, 245, .31);
      font: 8.5px "IBM Plex Mono", monospace;
    }
    .crossing-line .line-in { left: 12px; }
    .crossing-line .line-out { right: 12px; }
    .in-frame {
      position: absolute;
      bottom: 14px;
      left: 12px;
      line-height: 1;
    }
    .in-frame b {
      display: block;
      font: 600 25px "IBM Plex Mono", monospace;
    }
    .in-frame span { color: var(--muted); font-size: 9px; }
    .feed-meta {
      position: absolute;
      right: 12px;
      bottom: 13px;
      color: var(--muted);
      font: 9px "IBM Plex Mono", monospace;
    }

    .camera-info { padding: 13px 12px 12px; }
    .camera-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .camera-name { display: flex; align-items: center; gap: 9px; }
    .camera-name strong { font-size: 12px; }
    .camera-id {
      color: var(--muted);
      font: 9.5px "IBM Plex Mono", monospace;
      white-space: nowrap;
    }
    .mirror-note {
      margin-top: 5px;
      color: var(--delayed);
      font-size: 9px;
    }
    .camera-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .camera-stat {
      min-width: 0;
      height: 53px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }
    .camera-stat span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .55px;
    }
    .camera-stat b {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      font: 500 16px "IBM Plex Mono", monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .camera-controls {
      display: grid;
      grid-template-columns: 36px 1fr 1fr 36px;
      gap: 7px;
      margin-top: 12px;
    }
    .icon-button {
      width: 36px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
    }
    .icon-button:hover { background: rgba(255, 255, 255, .06); }
    .camera-controls .button { width: 100%; padding: 0 8px; }

    .chart-card {
      margin-top: 16px;
      padding: 16px 16px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }
    .chart-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .chart-heading strong {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .chart-heading span { color: var(--muted); font: 9.5px "IBM Plex Mono", monospace; }
    .chart-card svg {
      display: block;
      width: 100%;
      height: 180px;
      margin-top: 4px;
    }
    .chart-times {
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      color: rgba(244, 244, 245, .3);
      font: 9.5px "IBM Plex Mono", monospace;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(6, 6, 7, .75);
      backdrop-filter: blur(6px);
    }
    .overlay.open { display: flex; animation: fadein .16s ease; }
    .modal {
      width: min(820px, 94vw);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      background: #0e0e10;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .modal-title strong { font-size: 14px; }
    .modal-title span { color: var(--muted); }
    .close-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font-size: 20px;
    }
    .video-box {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #050506;
    }
    .video-box video { width: 100%; height: 100%; object-fit: contain; }
    .stream-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      background: #08080a;
      color: var(--muted);
      text-align: center;
    }
    .stream-state.hidden { display: none; }
    .modal-foot {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      padding: 14px 18px;
    }
    .modal-stat {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
    }
    .modal-stat span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }
    .modal-stat b { display: block; margin-top: 3px; font: 500 18px "IBM Plex Mono", monospace; }
    .confirm {
      width: min(440px, 94vw);
      padding: 22px;
      border: 1px solid rgba(226, 125, 118, .35);
      border-radius: 12px;
      background: #111113;
    }
    .confirm h3 { margin: 0; }
    .confirm p { color: var(--muted); line-height: 1.5; }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      z-index: 70;
      display: none;
      align-items: center;
      gap: 9px;
      transform: translateX(-50%);
      padding: 11px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #1a1a1d;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
    }
    .toast.show { display: flex; animation: fadein .18s ease; }
    .toast::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 50%;
      background: var(--ink);
    }

    @media (max-width: 1100px) {
      .brand { width: 250px; flex-basis: 250px; }
      .top-kpi { min-width: 105px; padding: 0 13px; }
      .sidebar { width: 300px; flex-basis: 300px; }
      .detail { padding-right: 14px; padding-left: 14px; }
      .feed { height: 330px; }
    }
    @media (max-width: 820px) {
      .fleet-kpis { display: none; }
      .brand { flex: 1; }
      .workspace { overflow-y: auto; display: block; }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .bus-list { max-height: 130px; }
      .detail { overflow: visible; }
      .camera-grid { grid-template-columns: 1fr; }
      .feed { height: min(430px, 58vw); min-height: 290px; }
      .app { overflow-y: auto; height: auto; min-height: 100vh; }
      .workspace { min-height: 0; }
    }
    @media (max-width: 570px) {
      .topbar { height: 58px; flex-basis: 58px; padding: 0 12px; }
      .top-actions .button:first-child { display: none; }
      .top-actions { min-width: 0; }
      .brand { min-width: 0; }
      .brand-copy small { display: none; }
      .bus-header { display: block; }
      .bus-actions { margin-top: 13px; }
      .bus-heading-line h1 { font-size: 23px; }
      .bus-subtitle { flex-wrap: wrap; }
      .occupancy-stats { gap: 24px; }
      .feed { height: 300px; }
      .camera-controls { grid-template-columns: 36px 1fr 1fr 36px; }
      .camera-stat b { font-size: 14px; }
      .chart-card svg { height: 130px; }
      .modal-foot { grid-template-columns: 1fr 1fr; }
      .modal-foot .button { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PC</div>
      <div class="brand-copy">
        <strong>Fleet Counter</strong>
        <small>Passenger counting · live</small>
      </div>
    </div>
    <div class="fleet-kpis">
      <div class="top-kpi"><span>Onboard now</span><b id="fleetOnboard">0</b></div>
      <div class="top-kpi"><span>Cameras online</span><b id="fleetCameras">0/0</b></div>
      <div class="top-kpi"><span>Boarded today</span><b id="fleetIn">0</b></div>
      <div class="top-kpi"><span>Alighted today</span><b id="fleetOut">0</b></div>
    </div>
    <div class="top-actions">
      <button id="refreshAll" class="button"></button>
      <button id="exportAll" class="button primary"></button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-tools">
        <div class="sidebar-title"><strong>Fleet</strong><span id="shown">0 shown</span></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="search" class="search" placeholder="Search bus, route, stop...">
        </div>
        <div class="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="online">Online</button>
          <button class="filter" data-filter="issues">Issues</button>
          <button class="filter" data-filter="offline">Offline</button>
        </div>
      </div>
      <div id="busList" class="bus-list"></div>
    </aside>
    <main id="detail" class="detail"><div class="detail-loading">Loading fleet...</div></main>
  </div>
</div>

<div id="streamOverlay" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">
        <i id="streamDot" class="status-dot"></i>
        <strong id="streamTitle">Camera stream</strong>
        <span id="streamSubtitle"></span>
      </div>
      <button id="closeStream" class="close-button" aria-label="Close stream">×</button>
    </div>
    <div class="video-box">
      <video id="preview" autoplay muted playsinline></video>
      <div id="streamState" class="stream-state">Connecting to camera...</div>
    </div>
    <div class="modal-foot">
      <div class="modal-stat"><span>Boarded (IN)</span><b id="streamIn">0</b></div>
      <div class="modal-stat"><span>Alighted (OUT)</span><b id="streamOut">0</b></div>
      <button id="retryStream" class="button"></button>
    </div>
  </div>
</div>

<div id="clearOverlay" class="overlay">
  <div class="confirm">
    <h3>Clear camera totals?</h3>
    <p id="clearMessage"></p>
    <div class="confirm-actions">
      <button id="cancelClear" class="button">Cancel</button>
      <button id="confirmClear" class="button danger">Clear camera</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = value => Number(value || 0).toLocaleString("en-US");
  const icons = {
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"></path></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path></svg>'
  };

  let fleet = {buses: [], totals: {}};
  let selectedId = null;
  let selected = null;
  let filter = "all";
  let query = "";
  let activeCamera = null;
  let clearCameraId = null;
  let rtc = null;
  let rtcLoader = null;
  let toastTimer = null;
  let refreshTimer = null;

  $("refreshAll").innerHTML = icons.refresh + "Refresh all";
  $("exportAll").innerHTML = icons.download + "Export";
  $("retryStream").innerHTML = icons.refresh + "Retry stream";

  function statusClass(status) {
    return status === "online" ? "online" : status === "delayed" ? "delayed" : "offline";
  }

  function statusLabel(status) {
    return status === "online" ? "Online" : status === "delayed" ? "Delayed" : "Offline";
  }

  function age(seconds) {
    if (seconds == null) return "no heartbeat";
    if (seconds < 5) return "just now";
    if (seconds < 60) return `${seconds}s ago`;
    if (seconds < 3600) return `${Math.round(seconds / 60)}m ago`;
    return `${Math.round(seconds / 3600)}h ago`;
  }

  function updated(iso) {
    if (!iso) return "never";
    const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    return age(seconds);
  }

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
  }

  async function json(url, options) {
    const response = await fetch(url, {cache: "no-store", ...options});
    const data = await response.json();
    if (!response.ok || data.ok === false) throw new Error(data.error || "Request failed");
    return data.data || data;
  }

  async function loadFleet({keepDetail = false} = {}) {
    fleet = await json("/api/dashboard/fleet");
    if (!selectedId && fleet.buses.length) selectedId = fleet.buses[0].id;
    renderFleet();
    if (selectedId && !keepDetail) await loadBus(selectedId);
  }

  function renderFleet() {
    const totals = fleet.totals || {};
    $("fleetOnboard").textContent = fmt(totals.onboard);
    $("fleetCameras").textContent = `${totals.logical_cameras_online || 0}/${totals.logical_cameras_total || 0}`;
    $("fleetIn").textContent = fmt(totals.in);
    $("fleetOut").textContent = fmt(totals.out);

    const needle = query.trim().toLowerCase();
    const buses = (fleet.buses || []).filter(bus => {
      if (filter === "online" && bus.status !== "online") return false;
      if (filter === "issues" && bus.status === "online") return false;
      if (filter === "offline" && bus.status !== "offline") return false;
      return !needle || `${bus.id} ${bus.name} ${bus.route} ${bus.path}`.toLowerCase().includes(needle);
    });

    $("shown").textContent = `${buses.length} shown`;
    $("busList").innerHTML = buses.map(bus => `
      <button class="bus-row ${bus.id === selectedId ? "selected" : ""}" data-bus="${bus.id}">
        <i class="status-dot ${statusClass(bus.status)}"></i>
        <span class="bus-copy">
          <span class="bus-line"><strong>Bus ${bus.number}</strong><span>${bus.route}</span></span>
          <span class="bus-path">${bus.path}</span>
        </span>
        <span class="bus-count">
          <b>${fmt(bus.totals.onboard)}<small> /65</small></b>
          <span>${updated(bus.last_update)}</span>
        </span>
      </button>
    `).join("") || '<div class="detail-loading">No buses match</div>';

    document.querySelectorAll("[data-bus]").forEach(row => {
      row.onclick = () => selectBus(row.dataset.bus);
    });
  }

  async function selectBus(id) {
    selectedId = id;
    renderFleet();
    await loadBus(id);
  }

  async function loadBus(id) {
    try {
      selected = await json(`/api/dashboard/buses/${encodeURIComponent(id)}`);
      renderBus();
    } catch (error) {
      $("detail").innerHTML = `<div class="detail-loading">${error.message}</div>`;
    }
  }

  function cameraCard(camera) {
    const frame = camera.stay || camera.onboard || 0;
    const signal = camera.status === "online" ? "LIVE" : camera.status === "delayed" ? "DELAYED" : "NO SIGNAL";
    const fps = camera.status === "online" ? "live feed" : camera.status === "delayed" ? "heartbeat delayed" : "no signal";
    return `
      <article class="camera-card">
        <div class="feed">
          <div class="feed-label">${camera.door_position} DOOR · overhead</div>
          <div class="live-badge ${statusClass(camera.status)}">
            <i class="status-dot ${statusClass(camera.status)}"></i>${signal}
          </div>
          <div class="crossing-line"><span class="line-in">↓ IN</span><span class="line-out">OUT ↑</span></div>
          <div class="in-frame"><b>${fmt(frame)}</b><span>in frame</span></div>
          <div class="feed-meta">${fps}</div>
        </div>
        <div class="camera-info">
          <div class="camera-title-row">
            <div>
              <div class="camera-name"><i class="status-dot ${statusClass(camera.status)}"></i><strong>${camera.label}</strong></div>
              ${camera.prototype_mirror ? '<div class="mirror-note">Prototype mirror · excluded from totals</div>' : ""}
            </div>
            <div class="camera-id">${camera.id}</div>
          </div>
          <div class="camera-stats">
            <div class="camera-stat"><span>IN</span><b>${fmt(camera.in)}</b></div>
            <div class="camera-stat"><span>OUT</span><b>${fmt(camera.out)}</b></div>
            <div class="camera-stat"><span>Updated</span><b>${updated(camera.last_count_update)}</b></div>
          </div>
          <div class="camera-controls">
            <button class="icon-button" title="Refresh camera" data-refresh="${camera.id}">${icons.refresh}</button>
            <button class="button" data-stream="${camera.id}">${icons.play}View stream</button>
            <button class="button" data-clear="${camera.id}">${icons.trash}Clear</button>
            <button class="icon-button" title="Export CSV" data-export-camera="${camera.id}">${icons.download}</button>
          </div>
        </div>
      </article>
    `;
  }

  function chart(samples, capacity) {
    const values = new Array(24).fill(0);
    samples.forEach(sample => {
      const hour = new Date(sample.time).getHours();
      values[hour] = Number(sample.onboard || 0);
    });
    const width = 680, height = 180, padX = 16, padY = 16;
    const max = Math.max(1, capacity || 1, ...values);
    const x = index => padX + index * (width - padX * 2) / 23;
    const y = value => height - padY - (value / max) * (height - padY * 2);
    let line = `M ${x(0).toFixed(1)} ${y(values[0]).toFixed(1)}`;
    for (let i = 1; i < values.length; i++) line += ` L ${x(i).toFixed(1)} ${y(values[i]).toFixed(1)}`;
    const area = `${line} L ${x(23).toFixed(1)} ${height - padY} L ${x(0).toFixed(1)} ${height - padY} Z`;
    return `
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Occupancy over today">
        <line x1="16" y1="53" x2="664" y2="53" stroke="rgba(255,255,255,.06)"></line>
        <line x1="16" y1="90" x2="664" y2="90" stroke="rgba(255,255,255,.06)"></line>
        <line x1="16" y1="127" x2="664" y2="127" stroke="rgba(255,255,255,.06)"></line>
        <path d="${area}" fill="rgba(244,244,245,.08)"></path>
        <path d="${line}" fill="none" stroke="#f4f4f5" stroke-width="1.6" stroke-linejoin="round"></path>
      </svg>
      <div class="chart-times"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    `;
  }

  function renderBus() {
    const bus = selected;
    const totals = bus.totals;
    const capacity = bus.capacity || 65;
    const percent = Math.max(0, Math.min(100, Math.round(totals.onboard / capacity * 100)));
    const latest = bus.cameras.reduce((best, camera) => !best || (camera.last_count_update || "") > best ? camera.last_count_update : best, "");
    const peak = Math.max(0, ...bus.session_samples.map(sample => Number(sample.onboard || 0)));

    $("detail").innerHTML = `
      <section class="bus-header">
        <div>
          <div class="bus-heading-line">
            <h1>Bus ${bus.number}</h1>
            <span class="status-badge"><i class="status-dot ${statusClass(bus.status)}"></i>${statusLabel(bus.status)}</span>
          </div>
          <div class="bus-subtitle">
            <span>${bus.route}</span><span class="separator">·</span>
            <span>${bus.path}</span><span class="separator">·</span>
            <span>Updated ${updated(latest)}</span>
          </div>
        </div>
        <div class="bus-actions">
          <button id="refreshBus" class="button">${icons.refresh}Refresh bus</button>
          <button id="exportBus" class="button">${icons.download}Export</button>
        </div>
      </section>

      <section class="occupancy-card">
        <div class="occupancy-head">
          <span class="eyebrow">Occupancy</span>
          <span class="occupancy-value">${fmt(totals.onboard)} / ${capacity} · ${percent}% full</span>
        </div>
        <div class="progress"><span style="width:${percent}%"></span></div>
        <div class="occupancy-stats">
          <div><span>Boarded today</span><b>${fmt(totals.in)}</b></div>
          <div><span>Alighted today</span><b>${fmt(totals.out)}</b></div>
        </div>
      </section>

      <section class="camera-grid">${bus.cameras.map(cameraCard).join("")}</section>

      <section class="chart-card">
        <div class="chart-heading">
          <strong>Occupancy over today</strong>
          <span>peak ${fmt(peak)} pax · current process</span>
        </div>
        ${chart(bus.session_samples, capacity)}
      </section>
    `;

    $("refreshBus").onclick = refreshSelected;
    $("exportBus").onclick = exportCsv;
    document.querySelectorAll("[data-stream]").forEach(button => button.onclick = () => openStream(button.dataset.stream));
    document.querySelectorAll("[data-refresh]").forEach(button => button.onclick = () => refreshCamera(button.dataset.refresh, button));
    document.querySelectorAll("[data-clear]").forEach(button => button.onclick = () => askClear(button.dataset.clear));
    document.querySelectorAll("[data-export-camera]").forEach(button => button.onclick = exportCsv);
  }

  async function refreshCamera(id, button) {
    try {
      button?.classList.add("spinning");
      await json(`/api/dashboard/cameras/${id}/refresh`, {method: "POST"});
      toast("Camera refreshed");
      await loadFleet();
    } catch (error) {
      toast(`Refresh failed: ${error.message}`);
    } finally {
      button?.classList.remove("spinning");
    }
  }

  async function refreshSelected() {
    const button = $("refreshBus");
    button?.classList.add("spinning");
    try {
      const physicalCamera = selected.cameras.find(camera => camera.include_in_aggregation);
      if (physicalCamera) await json(`/api/dashboard/cameras/${physicalCamera.id}/refresh`, {method: "POST"});
      toast("Bus refreshed");
      await loadFleet();
    } catch (error) {
      toast(`Refresh failed: ${error.message}`);
    } finally {
      button?.classList.remove("spinning");
    }
  }

  async function refreshAll() {
    $("refreshAll").classList.add("spinning");
    try {
      const cameras = selected ? selected.cameras.filter(camera => camera.include_in_aggregation) : [];
      for (const camera of cameras) await json(`/api/dashboard/cameras/${camera.id}/refresh`, {method: "POST"});
      await loadFleet();
      toast("Fleet refreshed");
    } catch (error) {
      toast(`Refresh failed: ${error.message}`);
    } finally {
      $("refreshAll").classList.remove("spinning");
    }
  }

  function exportCsv() {
    window.location.href = "/api/dashboard/export.csv";
  }

  function loadRtc(url) {
    if (window.ZLMRTCClient) return Promise.resolve();
    if (rtcLoader) return rtcLoader;
    rtcLoader = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = url;
      script.onload = resolve;
      script.onerror = () => reject(new Error("RTC client unavailable"));
      document.head.appendChild(script);
    });
    return rtcLoader;
  }

  function stopStream() {
    if (rtc) {
      rtc.close();
      rtc = null;
    }
    $("preview").pause();
    $("preview").srcObject = null;
  }

  async function openStream(id) {
    activeCamera = selected.cameras.find(camera => camera.id === id);
    $("streamTitle").textContent = `Bus ${selected.number}`;
    $("streamSubtitle").textContent = `${activeCamera.label} · ${activeCamera.id}`;
    $("streamDot").className = `status-dot ${statusClass(activeCamera.status)}`;
    $("streamIn").textContent = fmt(activeCamera.in);
    $("streamOut").textContent = fmt(activeCamera.out);
    $("streamOverlay").classList.add("open");
    $("streamState").classList.remove("hidden");
    $("streamState").textContent = "Connecting to camera...";
    stopStream();
    try {
      await loadRtc(activeCamera.rtc_client_url);
      const client = window.ZLMRTCClient;
      rtc = new client.Endpoint({
        element: $("preview"),
        zlmsdpUrl: activeCamera.webrtc_url,
        recvOnly: true,
        debug: false,
        audioEnable: false,
        videoEnable: true,
        simulcast: false,
        useCamera: false,
        usedatachannel: false
      });
      rtc.on(client.Events.WEBRTC_ON_REMOTE_STREAMS, () => {
        $("preview").play().catch(() => {});
        $("streamState").classList.add("hidden");
      });
      const fail = () => {
        $("streamState").classList.remove("hidden");
        $("streamState").textContent = "Stream unavailable. Check camera connectivity and retry.";
      };
      rtc.on(client.Events.WEBRTC_OFFER_ANWSER_EXCHANGE_FAILED, fail);
      rtc.on(client.Events.WEBRTC_ICE_CANDIDATE_ERROR, fail);
    } catch (error) {
      $("streamState").textContent = error.message;
    }
  }

  function closeStream() {
    stopStream();
    $("streamOverlay").classList.remove("open");
  }

  function askClear(id) {
    clearCameraId = id;
    const camera = selected.cameras.find(item => item.id === id);
    $("clearMessage").textContent = `${camera.label}${camera.prototype_mirror ? " mirrors the same physical camera as Front." : ""} This irreversibly resets the actual HX-CCD22 totals for both logical cards.`;
    $("clearOverlay").classList.add("open");
  }

  async function confirmClear() {
    $("confirmClear").disabled = true;
    try {
      await json(`/api/dashboard/cameras/${clearCameraId}/clear`, {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-Dashboard-Request": "HX-CCD22"},
        body: JSON.stringify({confirm: "CLEAR"})
      });
      $("clearOverlay").classList.remove("open");
      toast("Physical camera totals cleared");
      await loadFleet();
    } catch (error) {
      toast(`Clear failed: ${error.message}`);
    } finally {
      $("confirmClear").disabled = false;
    }
  }

  $("search").oninput = event => {
    query = event.target.value;
    renderFleet();
  };
  document.querySelectorAll(".filter").forEach(button => {
    button.onclick = () => {
      filter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
      renderFleet();
    };
  });
  $("refreshAll").onclick = refreshAll;
  $("exportAll").onclick = exportCsv;
  $("closeStream").onclick = closeStream;
  $("retryStream").onclick = () => activeCamera && openStream(activeCamera.id);
  $("cancelClear").onclick = () => $("clearOverlay").classList.remove("open");
  $("confirmClear").onclick = confirmClear;
  $("streamOverlay").onclick = event => {
    if (event.target === $("streamOverlay")) closeStream();
  };
  $("clearOverlay").onclick = event => {
    if (event.target === $("clearOverlay")) $("clearOverlay").classList.remove("open");
  };
  window.addEventListener("beforeunload", stopStream);

  loadFleet().catch(error => {
    $("detail").innerHTML = `<div class="detail-loading">${error.message}</div>`;
  });
  refreshTimer = setInterval(async () => {
    try {
      await loadFleet();
    } catch (_) {
      // Keep the last good values visible during transient camera/server errors.
    }
  }, 1000);
</script>
</body>
</html>
